/* =================== domínio: custos, reserva, DAS =================== */
function podeEditar(){return PERFIL==='dono'&&(!!S.db||!!S.gh.token)}
function custosAtivos(mes){return (S.custos||[]).filter(function(c){return c.inicio<=mes&&(!c.fim||c.fim>=mes)})}

function PE(mes){return CF(mes)/D.constantes.margem_medida}
function proxMes(){return somaMes(mesHoje(),1)}
function reservaLista(){var l=(S.reserva&&S.reserva.length)?S.reserva:D.reserva.map(function(r){return {data:r.data,saldo:r.saldo,obs:''}});return l.slice().sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:(a.criado_em||'')<(b.criado_em||'')?-1:1})}
function reservaAtual(){var l=reservaLista();return l[l.length-1]}
function reservaAte(d){var r=null;reservaLista().forEach(function(x){if(x.data<=d)r=x});return r}
function metaReserva(){var c=S.config||{};if(c.meta_tipo==='meses')return CF(proxMes())*(c.meta_meses||3);return c.meta_valor!=null&&isFinite(c.meta_valor)?c.meta_valor:D.constantes.meta_reserva}
function metaTxt(){var c=S.config||{};return c.meta_tipo==='meses'?(c.meta_meses+' meses de custo fixo'):'valor fixo'}
function ultimoFechado(){for(var i=D.meses.length-1;i>=0;i--)if(!D.meses[i].parcial)return D.meses[i];return null}
function mesAtual(){return D.meses[D.meses.length-1]}
function mesAnterior(m){var i=D.meses.indexOf(m);return i>0?D.meses[i-1]:null}
function fimDoMes(m){var p=m.split('-');return new Date(Date.UTC(+p[0],+p[1],0)).toISOString().slice(0,10)}
function pixReceber(mes){var pg=D.pagamentos[mes];if(!pg)return 0;return pg.itens.filter(function(i){return /a receber/i.test(i.forma)}).reduce(function(a,b){return a+b.atendido},0)}
function delta(d,ref){if(d==null||!isFinite(d))return null;return (d>=0?'▲ ':'▼ ')+F.P(Math.abs(d))+' vs '+ref}
function vendaMedia(){var f=D.meses.filter(function(m){return !m.parcial}).slice(-3);return f.reduce(function(a,m){return a+m.atendido},0)/(f.length||1)}
function mais30(){return D.carteira?D.carteira.lista.filter(function(l){return l.dias>30}):[]}

/* =================== VIEW: Parcial (metade do mês e até hoje, contra os outros meses) =================== */
var selParcial=null;

function pAcum(mes,corte){var l=(D.parcial.meses[mes]||[]).filter(function(p){return pdia(p)<=corte});var o={valor:0,fechado:0,aberto:0,pedidos:l.length,semGrandes:0,grandes:0};
  l.forEach(function(p){o.valor+=p[2];if(p[3]===9)o.fechado+=p[2];else o.aberto+=p[2];if(p[2]>=3000)o.grandes++;else o.semGrandes+=p[2]});o.ticket=o.pedidos?o.valor/o.pedidos:0;return o}

function nomeMes(m){return MESES_L[+m.slice(5)-1]}

        var parts=outros.filter(function(m){return m<ultimo}).map(function(m){var tot=pAcum(m,31).valor;return tot?pAcum(m,X).valor/tot:null}).filter(function(x){return x!=null});
        var pm=pMed(parts);var c2=h('div',{class:'ds-card'},[h('h3',{text:'Onde o mês deve fechar'})]);g.appendChild(c2);
        if(pm&&!(a.valor>0)){c2.appendChild(h('p',{class:'ds-small ds-muted',text:'Ainda cedo para estimar: nenhum pedido até o dia '+X+'. A estimativa aparece com a primeira venda do mês.'}))}else if(pm){var proj=a.valor/pm;c2.appendChild(DS.kpis([{label:'No ritmo de sempre',value:F.R(proj),meta:'até o dia '+X+' o mês costuma ter '+F.P(pm)+' da venda (mediana de '+parts.length+' meses)'}]));c2.appendChild(h('p',{class:'ds-small ds-muted',text:'É estimativa, não promessa: um pedido grande muda o resultado.'}))}

    })}
  secao(15,'Primeira metade: do dia 1 ao dia 15','corte fixo no dia 15');
  secao(X,(sel===ultimo&&X<diasSel?'Até hoje: do dia 1 ao dia '+X:'Até o dia '+X+(X>=diasSel?' (mês inteiro)':'')),'última atualização: '+F.data(D.dados_ate));
  DS.bloco(el,function(el){var s=DS.section(el,{titulo:'Mês a mês'});

/* =================== cofre (db cifrado) =================== */
function b64e(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function cifrar(o){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,new TextEncoder().encode(JSON.stringify(o))).then(function(ct){return {v:1,iv:b64e(iv),ct:b64e(ct)}})}
function decifrar(e){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},KEY,b64d(e.ct)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
/* lançamentos: base embutida + fonte ao vivo (banco do Claude ou arquivo no GitHub); vence o mais recente (t), com marcas de exclusão */
function tDe(x){return (x&&x.t)||''}
function aplicarDocs(){var ps={};Object.keys(S.base).forEach(function(p){ps[p]=1});Object.keys(S.live).forEach(function(p){ps[p]=1});
  var res=[],cus=[],das={},cfg=null;S.vence={};
  Object.keys(ps).forEach(function(p){var b=S.base[p],l=S.live[p];var w=(l&&(!b||tDe(l)>=tDe(b)))?l:b;if(!w||w.apagado||!w.o)return;S.vence[p]=w.o;var col=p.split('/')[0],id=p.slice(col.length+1);var o=Object.assign({},w.o,{id:id});
    if(col==='reserva'){if(o.data&&isFinite(o.saldo))res.push(o)}else if(col==='custos'){if(o.nome&&isFinite(o.valor)&&/^\d{4}-\d{2}$/.test(o.inicio))cus.push(o)}else if(col==='das'){if(o.mes)das[o.mes]=o}else if(p==='config/geral')cfg=w.o});
  S.reserva=res;S.custos=cus;S.das=das;S.config=cfg||{};agendar()}
function baseDe(L){var b={};if(!L)return b;if(L.docs){Object.keys(L.docs).forEach(function(p){var x=L.docs[p];if(x&&(x.apagado||x.o))b[p]=x});return b}
  (L.reserva||[]).forEach(function(r){if(r.id)b['reserva/'+r.id]={o:r,t:''}});(L.custos||[]).forEach(function(c){if(c.id)b['custos/'+c.id]={o:c,t:''}});Object.keys(L.das||{}).forEach(function(m){b['das/'+(L.das[m].id||m)]={o:L.das[m],t:''}});if(L.config&&Object.keys(L.config).length)b['config/geral']={o:L.config,t:''};return b}
function ingerir(docs,prefixo){if(prefixo!=null)Object.keys(S.live).forEach(function(p){if(p.indexOf(prefixo)===0&&!(p in docs))delete S.live[p]});
  return Promise.all(Object.keys(docs).map(function(p){var x=docs[p];if(!x)return null;S.raw[p]=x;if(x.apagado)return {p:p,v:{apagado:true,t:x.t}};if(!x.e)return null;var ck=p+'|'+x.e.iv;
    if(S.dec[ck])return {p:p,v:{o:S.dec[ck],t:x.t}};return decifrar(x.e).then(function(o){S.dec[ck]=o;return {p:p,v:{o:o,t:x.t}}},function(){return null})}))
  .then(function(l){l.forEach(function(r){if(!r)return;var c=S.live[r.p];if(prefixo!=null||!c||tDe(r.v)>=tDe(c))S.live[r.p]=r.v});aplicarDocs()})}
function um(p,x){var o={};o[p]=x;return o}
function escrever(p,x){if(S.db)return S.db.doc(p).set(x).then(function(){return ingerir(um(p,x))});if(S.gh.token)return ghGravar(function(docs){docs[p]=x}).then(function(){return ingerir(um(p,x))});return Promise.reject({code:'sem_permissao'})}
function salvar(caminho,o){if(!podeEditar())return Promise.reject({code:'sem_permissao'});var c=Object.assign({},o);delete c.id;return cifrar(c).then(function(e){return escrever(caminho,{e:e,t:new Date().toISOString()})})}
function apagar(caminho,msg){var antes=S.vence[caminho]?Object.assign({},S.vence[caminho]):null;return escrever(caminho,{apagado:true,t:new Date().toISOString()}).then(function(){DS.toast(msg,antes?{text:'Desfazer',fn:function(){salvar(caminho,antes).then(function(){DS.toast('Restaurado.')},function(e){DS.toast(erroTxt(e))})}}:null)})}
function erroTxt(e){var c=e&&e.code;if(c==='invalid_argument'||c==='sem_permissao')return 'Sem permissão para salvar por este acesso.';if(c==='gh_token'){var st=e.status;if(st===401)return 'O GitHub não reconheceu a chave (401): ela foi copiada incompleta, foi apagada ou venceu. Gere uma nova e cole inteira.';if(st===403)return 'A chave foi reconhecida, mas sem permissão (403). Em Permissions do repositório, marque Contents: Read and write.';if(st===404)return 'A chave não enxerga o repositório (404). Ao criar, em Resource owner escolha MuriloBianchinDev e em Repository access marque painel-bianchin.';return 'A chave de gravação não vale mais (vencida ou sem permissão). Cole uma nova na aba Reserva.'}if(c==='gh_rede')return 'Não consegui falar com o GitHub. Confira a internet e tente de novo.';if(c==='conflito')return 'Outra gravação aconteceu ao mesmo tempo. Tente de novo.';if(c==='quota_exceeded'||c==='quota_or_state')return 'O espaço de armazenamento da página acabou.';if(c==='too_large')return 'Arquivo grande demais (até '+(S.assets?'15':'10')+' MB).';if(c==='unsupported_type')return 'Use PDF, PNG, JPG ou WEBP.';return 'Não deu para salvar agora. Confira a internet e tente de novo.'}
function cifrarArquivo(buf){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,buf).then(function(ct){return JSON.stringify({v:1,iv:b64e(iv),ct:b64e(ct)})})}
function anexarCifrado(arq){var lim=S.assets?15:10;if(arq.size>lim*1024*1024)return Promise.reject({code:'too_large'});var meta={nome:arq.name,tipo:arq.type||'application/pdf'};
  return arq.arrayBuffer().then(cifrarArquivo).then(function(js){
    if(S.assets)return S.assets.upload(new Blob([js],{type:'application/json'}),{type:'application/json'}).then(function(r){return Object.assign({asset:r.id},meta)});
    var p='dados/guias/g-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.json';return ghPut(p,txtb64(js),null,'painel: guia anexada').then(function(){return Object.assign({gh:p},meta)})})}
function salvarArquivo(nome,tipo,buf){if(S.downloads)return S.downloads.save({filename:nome,data:new Blob([buf],{type:tipo})});var u=URL.createObjectURL(new Blob([buf],{type:tipo}));var a=h('a',{href:u,download:nome,style:'display:none'});document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},5000);return Promise.resolve()}
function baixarCifrado(g,btn){btn.disabled=true;
  var pega=g.gh?(S.gh.token?fetch(ghUrl(g.gh),{headers:ghHdr(true),cache:'no-store'}):fetch(g.gh,{cache:'no-store'})):fetch('/_blob/'+g.asset);
  pega.then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(e){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},KEY,b64d(e.ct))}).then(function(pt){return salvarArquivo(g.nome||'guia-das.pdf',g.tipo||'application/pdf',pt)}).then(function(){},function(e){if(!(e&&e.code==='declined'))DS.toast(g.gh&&!S.gh.token?'A guia ainda está sendo publicada. Tente de novo em alguns minutos.':'Não deu para abrir a guia neste aparelho.')}).then(function(){btn.disabled=false})}
var tR=null;function agendar(){clearTimeout(tR);tR=setTimeout(function(){if(D)renderTudo(true)},80)}
function ligarDb(){if(!window.claude||!window.claude.use){S.pronto=true;return}
  window.claude.use('db').then(function(db){S.db=db;S.pronto=true;if(!db){agendar();return}
    ['reserva','custos','das'].forEach(function(col){db.collection(col).onSnapshot(function(sn){var m={};sn.docs.forEach(function(d){m[col+'/'+d.id]=d.data()});ingerir(m,col+'/')},function(){})});
    db.doc('config/geral').onSnapshot(function(d){var m={};if(d.exists&&d.data())m['config/geral']=d.data();ingerir(m,'config/')},function(){});
  },function(){S.pronto=true});
  window.claude.use('assets').then(function(a){S.assets=a;agendar()},function(){});window.claude.use('downloads').then(function(d){S.downloads=d},function(){})}

/* =================== gravação pelo link público (GitHub) =================== */
var GH_API='https://api.github.com/repos/';
function txtb64(t){return b64e(new TextEncoder().encode(t))}
function b64txt(s){return new TextDecoder().decode(b64d(String(s||'').replace(/\s/g,'')))}
function ghHdr(raw){var o={'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json'};if(S.gh.token)o.Authorization='Bearer '+S.gh.token;return o}
function ghUrl(p){return GH_API+SITE.repo+'/contents/'+p+'?ref='+encodeURIComponent(SITE.branch||'main')+'&_='+Date.now()}
function ghErro(r){if(r.status===401||r.status===403||(r.status===404&&S.gh.token))return {code:'gh_token',status:r.status};if(r.status===409||r.status===422)return {code:'conflito'};return {code:'gh_'+r.status}}
function ghLerArquivo(){
  if(S.gh.token)return fetch(ghUrl(SITE.dados),{headers:ghHdr(),cache:'no-store'}).then(function(r){if(r.status===404)return fetch(GH_API+SITE.repo,{headers:ghHdr(),cache:'no-store'}).then(function(r2){if(!r2.ok)throw ghErro(r2);return {docs:{},sha:null}});if(!r.ok)throw ghErro(r);return r.json().then(function(j){var x=JSON.parse(b64txt(j.content)||'{}');return {docs:x.docs||{},sha:j.sha}})});
  return fetch(SITE.dados+'?_='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return {docs:{},sha:null};if(!r.ok)throw {code:'gh_'+r.status};return r.json().then(function(x){return {docs:x.docs||{},sha:null}})})}
function ghPut(p,conteudo,sha,msg){var corpo={message:msg,content:conteudo,branch:SITE.branch||'main'};if(sha)corpo.sha=sha;
  return fetch(GH_API+SITE.repo+'/contents/'+p,{method:'PUT',headers:Object.assign(ghHdr(),{'Content-Type':'application/json'}),body:JSON.stringify(corpo)}).then(function(r){if(!r.ok)throw ghErro(r);return r.json()})}
function ghGravar(mut,tent){tent=tent||0;return ghLerArquivo().then(function(a){mut(a.docs);return ghPut(SITE.dados,txtb64(JSON.stringify({v:1,docs:a.docs})),a.sha,'painel: lançamento '+new Date().toISOString().slice(0,16).replace('T',' '))})
  .catch(function(e){if(e&&e.code==='conflito'&&tent<3)return new Promise(function(ok){setTimeout(ok,600*(tent+1))}).then(function(){return ghGravar(mut,tent+1)});if(e&&e.code==='gh_token'){S.gh.erro='gh_token'}throw e})}
function ghPuxar(){if(!SITE)return Promise.resolve();return ghLerArquivo().then(function(a){S.gh.ok=true;S.gh.erro=null;S.gh.lido=new Date();return ingerir(a.docs)},function(e){S.gh.erro=e&&e.code;agendar()})}
function ligarGh(){if(!SITE)return;S.pronto=true;tokenCarregar().then(function(t){S.gh.token=t;agendar();return ghPuxar()});
  setInterval(function(){if(document.visibilityState==='visible')ghPuxar()},60000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')ghPuxar()})}
function tokenCarregar(){if(PERFIL!=='dono')return Promise.resolve(null);return idbOp('readonly',function(st){return st.get('gh')}).then(function(x){if(!x||!x.e)return null;return decifrar(x.e).then(function(o){return o.token||null},function(){return null})}).catch(function(){return null})}
function tokenGuardar(t){return cifrar({token:t}).then(function(e){return idbOp('readwrite',function(st){return st.put({e:e},'gh')})})}
function tokenApagar(){return idbOp('readwrite',function(st){return st.delete('gh')}).catch(function(){})}
function tokenTestar(t){return fetch(GH_API+SITE.repo,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t},cache:'no-store'}).then(function(r){if(!r.ok)throw {code:'gh_token',status:r.status};return r.json()},function(){throw {code:'gh_rede'}}).then(function(j){if(j.permissions&&j.permissions.push===false)throw {code:'gh_token',status:403}})}
function cartaoToken(){var f=h('form',{class:'ds-card ds-form'});f.appendChild(h('h3',{class:'ds-largo',text:'Ligar a gravação neste aparelho'}));
  f.appendChild(h('p',{class:'ds-small ds-muted ds-largo',text:'Para lançar saldo, custos e guias por este link, cole uma vez a chave de gravação do GitHub (token). Ela fica guardada só neste aparelho, cifrada (só abre depois do login do dono), e continua valendo mesmo depois de Sair. Para tirar, use Desligar gravação. Sem ela, a página só mostra.'}));
  f.appendChild(h('details',{class:'ds-largo'},[h('summary',{text:'Como criar a chave (1 minuto)'}),h('ol',{class:'ds-small',style:'margin:8px 0 0;padding-left:18px;display:grid;gap:4px'},[
    h('li',null,['Abra ',h('a',{href:'https://github.com/settings/personal-access-tokens/new',target:'_blank',rel:'noopener',text:'github.com → novo token ↗'}),' logado na conta da loja.']),
    h('li',{text:'Nome: painel-bianchin. Validade: a que preferir (ex.: 1 ano).'}),
    h('li',{text:'Repository access: Only select repositories → '+SITE.repo.split('/')[1]+'.'}),
    h('li',{text:'Permissions → Repository permissions → Contents: Read and write.'}),
    h('li',{text:'Clique em Generate token, copie e cole aqui.'})])]));
  var ft=DS.texto({id:'gh-token',label:'Chave de gravação (token)',placeholder:'github_pat_…',largo:true});ft.input.type='password';f.appendChild(ft);
  var bt=DS.btn({type:'submit',variant:'primary',text:'Ligar gravação'});f.appendChild(h('div',{class:'ds-acoes-form ds-largo'},[bt]));
  f.addEventListener('submit',function(ev){ev.preventDefault();var t=ft.input.value.trim();if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(t)){DS.toast('Isso não parece um token do GitHub. Ele começa com github_pat_.');return}
    bt.disabled=true;bt.textContent='Conferindo…';tokenTestar(t).then(function(){return tokenGuardar(t)}).then(function(){S.gh.token=t;S.gh.erro=null;ft.input.value='';DS.toast('Gravação ligada neste aparelho.');agendar();return ghPuxar()},function(e){DS.toast(erroTxt(e))}).then(function(){bt.disabled=false;bt.textContent='Ligar gravação'})});
  return f}
function linhaGravacao(){var b=null;if(S.gh.token){b=DS.btn({sm:true,text:'Desligar'});b.addEventListener('click',function(){DS.confirmar({ok:'Desligar',titulo:'Desligar a gravação neste aparelho?',texto:'A chave é apagada daqui. O que já foi lançado continua salvo.',acao:function(){return tokenApagar().then(function(){S.gh.token=null;agendar();DS.toast('Gravação desligada neste aparelho.')})}})})}
  return DS.row({titulo:'Gravação neste aparelho',valor:S.gh.token?(S.gh.erro==='gh_token'?'chave inválida':'ligada'):'desligada',acao:b,meta:S.gh.token?'lançamentos vão cifrados para o arquivo do site':'cole a chave na aba Reserva para lançar por aqui'})}

/* =================== navegação =================== */
var VIEWS=[{id:'inicio',rot:'Início',fn:vInicio,g:'Acompanhar'},{id:'parcial',rot:'Parcial',fn:vParcial,g:'Acompanhar'},{id:'mes',rot:'Mês',fn:vMes,g:'Acompanhar'},{id:'receber',rot:'A receber',fn:vReceber,g:'Acompanhar'},{id:'estoque',rot:'Estoque',fn:vEstoque,g:'Acompanhar'},{id:'compras',rot:'Compras a pagar',fn:vCompras,g:'Acompanhar'},{id:'historico',rot:'Histórico',fn:vHistorico,g:'Acompanhar'},
  {id:'reserva',rot:'Reserva',fn:vReserva,g:'Lançar'},{id:'custos',rot:'Custos e imposto',fn:vCustos,g:'Lançar'},{id:'dicas',rot:'Dicas',fn:vDicas,g:'Aprender'},{id:'conferencia',rot:'Conferência dos dados',fn:vConferencia,g:'Aprender'}];
var BOTTOM=['inicio','parcial','receber','reserva'];var atual='inicio';
function montarNav(){var nav=$('#nav');nav.innerHTML='';var g='';var nl=mais30().length;
  VIEWS.forEach(function(v){if(v.g!==g){g=v.g;nav.appendChild(h('div',{class:'ds-nav__grupo',text:g}))}var b=h('button',{type:'button',class:'ds-nav__item','data-v':v.id},[ico(v.id),v.rot,v.id==='receber'&&nl?h('span',{class:'ds-nav__badge',text:String(nl)}):null]);b.addEventListener('click',function(){ir(v.id)});nav.appendChild(b)});
  var bt=$('#bottom');bt.innerHTML='';BOTTOM.forEach(function(id){var v=VIEWS.find(function(x){return x.id===id});var b=h('button',{type:'button','data-v':id},[ico(id),v.rot,id==='receber'&&nl?h('span',{class:'ds-nav__badge',text:String(nl)}):null]);b.addEventListener('click',function(){ir(id)});bt.appendChild(b)});
  var mais=h('button',{type:'button','data-v':'mais','aria-haspopup':'dialog'},[ico('mais'),'Mais']);mais.addEventListener('click',function(){var fechar=DS.sheet('Mais',VIEWS.filter(function(v){return BOTTOM.indexOf(v.id)<0}).map(function(v){var b=h('button',{type:'button',class:'ds-sheet__item'},[ico(v.id),v.rot]);b.addEventListener('click',function(){fechar();ir(v.id)});return b}).concat([(function(){var b=h('button',{type:'button',class:'ds-sheet__item'},[ico('bad'),'Sair']);b.addEventListener('click',sair);return b})()]))});bt.appendChild(mais)}
function stampGeral(){var idade=dias(D.dados_ate,hoje());var t='Dados do Bling de '+F.dm(D.dados_ate);var el=h('span',{class:'ds-stamp'+(idade>3?' ds-stamp--velho':''),text:t+(idade>0?' · há '+idade+' dia'+(idade>1?'s':''):'')});return el}
function ir(id){var v=VIEWS.find(function(x){return x.id===id})||VIEWS[0];atual=v.id;$('#titulo').textContent=v.rot;
  document.querySelectorAll('[data-v]').forEach(function(b){if(b.getAttribute('data-v')===v.id||(b.getAttribute('data-v')==='mais'&&BOTTOM.indexOf(v.id)<0))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  document.querySelectorAll('#views>section[data-view]').forEach(function(s){s.hidden=s.getAttribute('data-view')!==v.id});
  try{if(location.hash!=='#'+v.id)history.replaceState(null,'','#'+v.id)}catch(e){}window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){if(D)ir(location.hash.slice(1))});
function renderView(id){var v=VIEWS.find(function(x){return x.id===id});var el=$('#views>section[data-view="'+id+'"]');el.innerHTML='';DS.bloco(el,v.fn)}
function renderTudo(manter){var y=window.scrollY;var ae=document.activeElement;var digitando=ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&ae.closest('#views');
  VIEWS.forEach(function(v){var el=$('#views>section[data-view="'+v.id+'"]');if(manter&&digitando&&el.contains(ae))return;el.innerHTML='';DS.bloco(el,v.fn)});
  var st=$('#stamp');st.innerHTML='';st.appendChild(stampGeral());var idade=dias(D.dados_ate,hoje());
  $('#side-stamp').textContent='Bling até '+F.dm(D.dados_ate)+' · página de '+new Date(D.gerado_em).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'});$('#top-stamp').textContent='Bling até '+F.dm(D.dados_ate);
  var ro=$('#ro');ro.innerHTML='';if(PERFIL!=='dono')ro.appendChild(h('span',{class:'ds-badge-ro',text:'Somente leitura'}));
  if(idade>10){var vi=$('#views>section[data-view="inicio"]');if(vi&&!(manter&&digitando))vi.insertBefore(h('div',{class:'ds-banner'},['Números de '+idade+' dias atrás. '+(D.editorial.proxima_atualizacao?'Próxima atualização: '+D.editorial.proxima_atualizacao+'.':'')]),vi.firstChild)}
  if(manter)window.scrollTo(0,y)}

/* =================== acesso =================== */
function idUsuario(u){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('bianchin-u|'+u.trim().toLowerCase())).then(function(d){return b64e(new Uint8Array(d).slice(0,12))})}
function entrarCom(usuario,senha){return idUsuario(usuario).then(function(id){var e=PACOTE.u[id];if(!e)throw new Error('x');
  return crypto.subtle.importKey('raw',new TextEncoder().encode(usuario.trim().toLowerCase()+'\n'+senha),'PBKDF2',false,['deriveKey']).then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(e.s),iterations:PACOTE.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},k,b64d(e.w))}).then(function(pt){var w=JSON.parse(new TextDecoder().decode(pt));return crypto.subtle.importKey('raw',b64d(w.k),'AES-GCM',false,['encrypt','decrypt']).then(function(ck){return {k:ck,perfil:w.perfil,nome:w.nome}})})})}
function abrir(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PACOTE.iv)},k,b64d(PACOTE.ct)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
function idb(){return new Promise(function(ok,nok){try{var r=indexedDB.open('bianchin-painel',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){nok(r.error)}}catch(e){nok(e)}})}
function idbOp(modo,fn){return idb().then(function(db){return new Promise(function(ok,nok){var tx=db.transaction('k',modo);var req=fn(tx.objectStore('k'));tx.oncomplete=function(){ok(req&&req.result)};tx.onerror=function(){nok(tx.error)}})})}
function guardar(s){return idbOp('readwrite',function(st){return st.put({k:s.k,perfil:s.perfil,nome:s.nome,ate:Date.now()+30*864e5,kid:PACOTE.kid},'sessao')}).catch(function(){})}
function esquecer(){return idbOp('readwrite',function(st){st.delete('chave');return st.delete('sessao')}).catch(function(){})} /* a chave de gravação (gh) fica no aparelho, cifrada com a chave dos dados: só sai em "Desligar gravação" */
function lerSessao(){return idbOp('readonly',function(st){return st.get('sessao')}).catch(function(){return null})}
function mostrar(dados,sess){D=dados;KEY=sess.k;PERFIL=sess.perfil||'equipe';NOME=sess.nome||'';
  S.base=baseDe(D.lancamentos);if(D.lancamentos)aplicarDocs();
  $('#login').hidden=true;$('#app').hidden=false;$('#side-user').textContent=NOME+(PERFIL==='dono'?' · dono':' · equipe');
  var vs=$('#views');vs.innerHTML='';VIEWS.forEach(function(v){vs.appendChild(h('section',{'data-view':v.id,class:'ds-view',hidden:true,'aria-labelledby':'titulo'}))});
  if(!window.claude||!window.claude.use)S.pronto=true;montarNav();renderTudo(false);ir((location.hash||'#inicio').slice(1));ligarDb();ligarGh()}
function sair(){esquecer().then(function(){location.reload()})}
$('#sair').addEventListener('click',sair);
function tentarSessao(){if(!PACOTE||!window.crypto||!crypto.subtle)return Promise.resolve(false);return lerSessao().then(function(g){if(!g||!g.k||g.ate<Date.now()||g.kid!==PACOTE.kid){if(g)esquecer();return false}return abrir(g.k).then(function(d){mostrar(d,g);return true},function(){esquecer();return false})})}
$('#f-login').addEventListener('submit',function(ev){ev.preventDefault();var btn=$('#entrar'),err=$('#erro');err.textContent='';
  if(!PACOTE){err.textContent='Esta página ainda não tem dados.';return}if(!window.crypto||!crypto.subtle){err.textContent='Este navegador não permite abrir os dados com segurança. Tente outro navegador.';return}
  btn.disabled=true;btn.textContent='Abrindo…';var lembrar=$('#lembrar').checked;
  entrarCom($('#u').value,$('#s').value).then(function(sess){return abrir(sess.k).then(function(d){$('#s').value='';return (lembrar?guardar(sess):esquecer()).then(function(){mostrar(d,sess)})})}).catch(function(){err.textContent='Usuário ou senha incorretos.'}).then(function(){btn.disabled=false;btn.textContent='Entrar'})});
['lg-logo','side-logo','top-logo'].forEach(function(id){var im=$('#'+id);if(LOGO)im.src=LOGO;else im.replaceWith(h('strong',{style:'font:400 1.6rem var(--ds-font-display);letter-spacing:.04em;color:#fff',text:'BIANCHIN'}))});
tentarSessao().then(function(ok){if(!ok){try{$('#u').focus({preventScroll:true})}catch(e){}}});
})();
</script>
