/* ---------- Card / KPI ---------- */

/* =================== cofre (db cifrado) =================== */
function b64e(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function cifrar(o){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,new TextEncoder().encode(JSON.stringify(o))).then(function(ct){return {v:1,iv:b64e(iv),ct:b64e(ct)}})}
function decifrar(e){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},KEY,b64d(e.ct)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
function salvar(caminho,o){if(!podeEditar())return Promise.reject({code:'sem_permissao'});return cifrar(o).then(function(e){return S.db.doc(caminho).set({e:e,t:new Date().toISOString()})})}
function apagar(caminho,msg){var antes=S.raw[caminho];return S.db.doc(caminho).delete().then(function(){DS.toast(msg,antes?{text:'Desfazer',fn:function(){S.db.doc(caminho).set(antes).then(function(){DS.toast('Restaurado.')},function(e){DS.toast(erroTxt(e))})}}:null)})}
function erroTxt(e){var c=e&&e.code;if(c==='invalid_argument'||c==='sem_permissao')return 'Sem permissão para salvar por este acesso.';if(c==='quota_exceeded'||c==='quota_or_state')return 'O espaço de armazenamento da página acabou.';if(c==='too_large')return 'Arquivo grande demais (até 15 MB).';if(c==='unsupported_type')return 'Use PDF, PNG, JPG ou WEBP.';return 'Não deu para salvar agora. Tente de novo em instantes.'}
function anexarCifrado(arq){if(arq.size>15*1024*1024)return Promise.reject({code:'too_large'});return arq.arrayBuffer().then(function(buf){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,buf).then(function(ct){return S.assets.upload(new Blob([JSON.stringify({v:1,iv:b64e(iv),ct:b64e(ct)})],{type:'application/json'}),{type:'application/json'})}).then(function(r){return {asset:r.id,nome:arq.name,tipo:arq.type||'application/pdf'}})})}
function baixarCifrado(g,btn){btn.disabled=true;fetch('/_blob/'+g.asset).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(e){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},KEY,b64d(e.ct))}).then(function(pt){if(!S.downloads)throw {code:'unavailable'};return S.downloads.save({filename:g.nome||'guia-das.pdf',data:new Blob([pt],{type:g.tipo})})}).then(function(){},function(e){if(!(e&&e.code==='declined'))DS.toast('Não deu para abrir a guia neste aparelho.')}).then(function(){btn.disabled=false})}
function decifrarColecao(sn,col){return Promise.all(sn.docs.map(function(d){var x=d.data();if(!x||!x.e)return null;S.raw[col+'/'+d.id]=x;return decifrar(x.e).then(function(o){o.id=d.id;return o},function(){return null})})).then(function(l){return l.filter(Boolean)})}

function renderView(id){var v=VIEWS.find(function(x){return x.id===id});var el=$('#views>section[data-view="'+id+'"]');el.innerHTML='';DS.bloco(el,v.fn)}
function renderTudo(manter){var y=window.scrollY;var ae=document.activeElement;var digitando=ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&ae.closest('#views');
  VIEWS.forEach(function(v){var el=$('#views>section[data-view="'+v.id+'"]');if(manter&&digitando&&el.contains(ae))return;el.innerHTML='';DS.bloco(el,v.fn)});
  var st=$('#stamp');st.innerHTML='';st.appendChild(stampGeral());var idade=dias(D.dados_ate,hoje());
  $('#side-stamp').textContent='Bling até '+F.dm(D.dados_ate)+' · página de '+new Date(D.gerado_em).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'});$('#top-stamp').textContent='Bling até '+F.dm(D.dados_ate);
  var ro=$('#ro');ro.innerHTML='';if(PERFIL!=='dono')ro.appendChild(h('span',{class:'ds-badge-ro',text:'Somente leitura'}));
  if(idade>10){var vi=$('#views>section[data-view="inicio"]');if(vi&&!(manter&&digitando))vi.insertBefore(h('div',{class:'ds-banner'},['Números de '+idade+' dias atrás. '+(D.editorial.proxima_atualizacao?'Próxima atualização: '+D.editorial.proxima_atualizacao+'.':'')]),vi.firstChild)}
  if(manter)window.scrollTo(0,y)}

/* =================== acesso =================== */
function idUsuario(u){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('bianchin-u|'+u.trim().toLowerCase())).then(function(d){return b64e(new Uint8Array(d).slice(0,12))})}
function entrarCom(usuario,senha){return idUsuario(usuario).then(function(id){var e=PACOTE.u[id];if(!e)throw new Error('x');
  return crypto.subtle.importKey('raw',new TextEncoder().encode(usuario.trim().toLowerCase()+'\n'+senha),'PBKDF2',false,['deriveKey']).then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(e.s),iterations:PACOTE.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},k,b64d(e.w))}).then(function(pt){var w=JSON.parse(new TextDecoder().decode(pt));return crypto.subtle.importKey('raw',b64d(w.k),'AES-GCM',false,['encrypt','decrypt']).then(function(ck){return {k:ck,perfil:w.perfil,nome:w.nome}})})})}
function abrir(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PACOTE.iv)},k,b64d(PACOTE.ct)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
function idb(){return new Promise(function(ok,nok){try{var r=indexedDB.open('bianchin-painel',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){nok(r.error)}}catch(e){nok(e)}})}
function idbOp(modo,fn){return idb().then(function(db){return new Promise(function(ok,nok){var tx=db.transaction('k',modo);var req=fn(tx.objectStore('k'));tx.oncomplete=function(){ok(req&&req.result)};tx.onerror=function(){nok(tx.error)}})})}
function guardar(s){return idbOp('readwrite',function(st){return st.put({k:s.k,perfil:s.perfil,nome:s.nome,ate:Date.now()+30*864e5,kid:PACOTE.kid},'sessao')}).catch(function(){})}
function esquecer(){return idbOp('readwrite',function(st){st.delete('chave');return st.delete('sessao')}).catch(function(){})}
function lerSessao(){return idbOp('readonly',function(st){return st.get('sessao')}).catch(function(){return null})}
function mostrar(dados,sess){D=dados;KEY=sess.k;PERFIL=sess.perfil||'equipe';NOME=sess.nome||'';
  if(D.lancamentos){S.reserva=D.lancamentos.reserva;S.custos=D.lancamentos.custos;S.das=D.lancamentos.das;S.config=D.lancamentos.config}
  $('#login').hidden=true;$('#app').hidden=false;$('#side-user').textContent=NOME+(PERFIL==='dono'?' · dono':' · equipe');
  var vs=$('#views');vs.innerHTML='';VIEWS.forEach(function(v){vs.appendChild(h('section',{'data-view':v.id,class:'ds-view',hidden:true,'aria-labelledby':'titulo'}))});
  if(!window.claude||!window.claude.use)S.pronto=true;montarNav();renderTudo(false);ir((location.hash||'#inicio').slice(1));ligarDb()}
function sair(){esquecer().then(function(){location.reload()})}
$('#sair').addEventListener('click',sair);
function tentarSessao(){if(!PACOTE||!window.crypto||!crypto.subtle)return Promise.resolve(false);return lerSessao().then(function(g){if(!g||!g.k||g.ate<Date.now()||g.kid!==PACOTE.kid){if(g)esquecer();return false}return abrir(g.k).then(function(d){mostrar(d,g);return true},function(){esquecer();return false})})}
$('#f-login').addEventListener('submit',function(ev){ev.preventDefault();var btn=$('#entrar'),err=$('#erro');err.textContent='';
  if(!PACOTE){err.textContent='Esta página ainda não tem dados.';return}if(!window.crypto||!crypto.subtle){err.textContent='Este navegador não permite abrir os dados com segurança. Tente outro navegador.';return}
  btn.disabled=true;btn.textContent='Abrindo…';var lembrar=$('#lembrar').checked;
  entrarCom($('#u').value,$('#s').value).then(function(sess){return abrir(sess.k).then(function(d){$('#s').value='';return (lembrar?guardar(sess):esquecer()).then(function(){mostrar(d,sess)})})}).catch(function(){err.textContent='Usuário ou senha incorretos.'}).then(function(){btn.disabled=false;btn.textContent='Entrar'})});
['lg-logo','side-logo','top-logo'].forEach(function(id){var im=$('#'+id);if(LOGO)im.src=LOGO;else im.replaceWith(h('strong',{style:'font:400 1.6rem var(--ds-font-display);letter-spacing:.04em;color:#fff',text:'BIANCHIN'}))});
tentarSessao().then(function(ok){if(!ok){try{$('#u').focus({preventScroll:true})}catch(e){}}});
})();
</script>
